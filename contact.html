<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ | アットウィルセキュリティ株式会社</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Noto+Sans+JP:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Noto Sans JP', 'sans-serif'],
            en: ['Montserrat', 'sans-serif'],
          },
          colors: {
            navy: { 900: '#0a192f', 800: '#112240' },
            accent: '#00e5ff',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-navy-900 text-white font-sans antialiased min-h-screen flex flex-col">

  <!-- 動きのある背景 (Canvas) -->
  <canvas id="bg-canvas" class="fixed inset-0 z-0 pointer-events-none opacity-40"></canvas>

  <div class="relative z-10 flex-grow flex flex-col">

    <!-- 共通ヘッダー -->
    <header class="fixed top-0 w-full flex justify-between items-center py-5 px-6 md:px-12 bg-navy-900/95 backdrop-blur-md border-b border-white/10 z-40">
      <div class="font-en font-bold text-lg md:text-xl tracking-wider">
        <a href="index.html" class="hover:text-accent transition-colors">AT WILL SECURITY</a>
      </div>
      <nav class="hidden md:flex gap-8 text-sm font-en tracking-widest">
        <a href="company.html" class="hover:text-accent transition-colors">ABOUT</a>
        <a href="service.html" class="hover:text-accent transition-colors">SERVICE</a>
        <a href="recruit.html" class="hover:text-accent transition-colors">RECRUIT</a>
        <a href="contact.html" class="hover:text-accent transition-colors">CONTACT</a>
      </nav>
      <!-- スマホ用メニューボタン -->
      <button id="mobile-menu-btn" class="md:hidden text-white focus:outline-none z-50">
        <i class="fa-solid fa-bars text-2xl"></i>
      </button>
    </header>

    <!-- 共通スマホメニュー -->
    <div id="mobile-menu" class="hidden fixed inset-0 bg-navy-900/95 backdrop-blur-lg z-30 flex flex-col justify-center items-center">
      <nav class="flex flex-col gap-8 text-xl font-en tracking-widest text-center">
        <a href="company.html" class="hover:text-accent transition-colors">ABOUT</a>
        <a href="service.html" class="hover:text-accent transition-colors">SERVICE</a>
        <a href="recruit.html" class="hover:text-accent transition-colors">RECRUIT</a>
        <a href="contact.html" class="hover:text-accent transition-colors">CONTACT</a>
      </nav>
    </div>

    <!-- ページタイトル (Hero) -->
    <section class="pt-40 pb-12 px-6 md:px-24">
      <div class="max-w-4xl mx-auto text-center">
        <p class="text-accent font-en tracking-[0.3em] mb-4 text-sm">CONTACT US</p>
        <h1 class="text-3xl md:text-5xl font-black mb-6">お問い合わせ</h1>
        <p class="text-gray-400 text-sm md:text-base leading-relaxed">
          警備のご依頼や求人に関するご質問など、お気軽にお問い合わせください。<br class="hidden md:block">
          内容を確認次第、担当者よりご連絡させていただきます。
        </p>
      </div>
    </section>

    <!-- フォームセクション -->
    <section class="px-6 md:px-24 pb-24 flex-grow">
      <div class="max-w-3xl mx-auto bg-navy-800/60 backdrop-blur-md border border-white/10 p-8 md:p-12 shadow-2xl relative">
        <!-- フォーム送信状態メッセージ用 (JSで制御) -->
        <div id="form-message" class="hidden text-center p-4 mb-6 rounded font-bold transition-all"></div>

        <form id="contact-form" class="space-y-8">
          
          <!-- お問い合わせ種別 -->
          <div class="flex flex-col">
            <label for="inquiry_type" class="text-sm font-bold text-gray-300 mb-2">お問い合わせ種別 <span class="text-accent text-xs ml-2">*必須</span></label>
            <div class="relative">
              <select id="inquiry_type" name="inquiry_type" required class="w-full bg-transparent border-b border-white/30 text-white py-3 focus:outline-none focus:border-accent transition-colors appearance-none cursor-pointer">
                <option value="" class="text-navy-900">選択してください</option>
                <option value="警備のご依頼・お見積り" class="text-navy-900">警備のご依頼・お見積り</option>
                <option value="採用に関するお問い合わせ" class="text-navy-900">採用に関するお問い合わせ</option>
                <option value="その他のお問い合わせ" class="text-navy-900">その他のお問い合わせ</option>
              </select>
              <i class="fa-solid fa-chevron-down absolute right-2 top-4 text-gray-400 pointer-events-none"></i>
            </div>
          </div>

          <!-- 会社名・お名前 (2カラム) -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="flex flex-col">
              <label for="company_name" class="text-sm font-bold text-gray-300 mb-2">会社名 <span class="text-gray-500 text-xs ml-2">任意</span></label>
              <input type="text" id="company_name" name="company_name" placeholder="例: 株式会社〇〇" class="w-full bg-transparent border-b border-white/30 text-white py-3 focus:outline-none focus:border-accent transition-colors placeholder-gray-600">
            </div>
            <div class="flex flex-col">
              <label for="full_name" class="text-sm font-bold text-gray-300 mb-2">お名前 <span class="text-accent text-xs ml-2">*必須</span></label>
              <input type="text" id="full_name" name="full_name" required placeholder="例: 山田 太郎" class="w-full bg-transparent border-b border-white/30 text-white py-3 focus:outline-none focus:border-accent transition-colors placeholder-gray-600">
            </div>
          </div>

          <!-- メールアドレス・電話番号 (2カラム) -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="flex flex-col">
              <label for="email" class="text-sm font-bold text-gray-300 mb-2">メールアドレス <span class="text-accent text-xs ml-2">*必須</span></label>
              <input type="email" id="email" name="email" required placeholder="例: info@example.com" class="w-full bg-transparent border-b border-white/30 text-white py-3 focus:outline-none focus:border-accent transition-colors placeholder-gray-600">
            </div>
            <div class="flex flex-col">
              <label for="phone" class="text-sm font-bold text-gray-300 mb-2">電話番号 <span class="text-gray-500 text-xs ml-2">任意</span></label>
              <input type="tel" id="phone" name="phone" placeholder="例: 090-1234-5678" class="w-full bg-transparent border-b border-white/30 text-white py-3 focus:outline-none focus:border-accent transition-colors placeholder-gray-600">
            </div>
          </div>

          <!-- お問い合わせ内容 -->
          <div class="flex flex-col">
            <label for="message" class="text-sm font-bold text-gray-300 mb-2">お問い合わせ内容 <span class="text-accent text-xs ml-2">*必須</span></label>
            <textarea id="message" name="message" required rows="6" placeholder="ご質問やご依頼内容を具体的にご記入ください。" class="w-full bg-white/5 border border-white/20 rounded p-4 text-white focus:outline-none focus:border-accent transition-colors placeholder-gray-600 resize-none mt-2"></textarea>
          </div>

          <!-- プライバシーポリシー同意 -->
          <div class="flex items-start gap-3 mt-4">
            <input type="checkbox" id="privacy_policy" name="privacy_policy" required class="mt-1 accent-accent cursor-pointer">
            <label for="privacy_policy" class="text-sm text-gray-400 cursor-pointer leading-relaxed">
              ご入力いただいた個人情報は、お問い合わせ対応のためにのみ利用いたします。<br class="hidden md:block">
              当社の個人情報の取り扱いに同意の上、送信してください。
            </label>
          </div>

          <!-- 送信ボタン -->
          <div class="text-center pt-6">
            <button type="submit" id="submit-btn" class="inline-flex items-center justify-center gap-3 bg-accent text-navy-900 px-16 py-4 font-en font-bold tracking-widest hover:bg-white hover:text-navy-900 transition-all duration-300 w-full md:w-auto">
              <span>SEND MESSAGE</span>
              <i class="fa-solid fa-paper-plane"></i>
            </button>
          </div>
        </form>
      </div>
    </section>

    <!-- フッター -->
    <footer class="border-t border-white/10 py-12 px-6 md:px-24 flex flex-col md:flex-row justify-between items-center bg-navy-900 mt-auto relative z-20">
      <div class="mb-6 md:mb-0 text-center md:text-left">
        <h2 class="font-en font-bold text-xl mb-3 tracking-widest">AT WILL SECURITY CO.,LTD.</h2>
        <p class="text-sm text-gray-400 mb-1">〒351-0115 埼玉県和光市新倉1-5-25 ロワジール102</p>
        <div class="flex justify-center md:justify-start gap-4 text-xs font-en text-gray-500 mt-4">
          <a href="company.html" class="hover:text-white transition">会社概要</a>
          <a href="company.html#sign" class="hover:text-white transition">標識</a>
          <a href="company.html#access" class="hover:text-white transition">アクセス</a>
        </div>
      </div>
      <div class="text-gray-500 text-xs font-en tracking-widest">
        &copy; 2026 AT WILL SECURITY All Rights Reserved.
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
